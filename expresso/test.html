<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circular Slideshow</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    .circle-container {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }

    .circle-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s ease-in-out;
    }

    .arrow-button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
    }

    .arrow-button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <div class="circle-container">
    <img id="slideshow-img" src="eventbg_zip57y.png" alt="Slideshow">
  </div>

  <button class="arrow-button" onclick="nextImage()">➡️ Next</button>

  <script>
    const images = [
      "eventbg_zip57y.png",
      "image.png",
    //   "https://via.placeholder.com/300x300.png?text=Image+3",
    //   "https://via.placeholder.com/300x300.png?text=Image+4"
    ]; 

    let currentIndex = 0;

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      const img = document.getElementById("slideshow-img");
      img.style.opacity = 0;

      setTimeout(() => {
        img.src = images[currentIndex];
        img.style.opacity = 1;
      }, 200);
    }
   
  </script>

</body>
</html>
